<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Eliminar Cliente</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="../assets/css/topbar.css">
  <link rel="stylesheet" href="./clientes.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="content-wrapper">
    <header class="topbar" id="topbar"></header>

    <main class="main-content">
      <section class="clientes-header">
        <div>
          <h1>Eliminar Cliente</h1>
          <p>El sistema verifica vínculos activos antes de ejecutar la acción.</p>
        </div>

        <div class="clientes-header-actions">
          <a href="listar_clientes.html" class="btn btn-secondary">Volver al listado</a>
        </div>
      </section>

      <section class="clientes-section">
        <h2>Revisión del cliente</h2>

        <div class="cliente-detail-grid">
          <div class="cliente-detail-label">RUT</div>
          <div class="cliente-detail-value" id="resumenRut">Cargando...</div>
          <div class="cliente-detail-label">Razón Social</div>
          <div class="cliente-detail-value" id="resumenNombre">Cargando...</div>
        </div>

        <p id="textoVerificacion" class="alert-box">
          Consultando vínculos del cliente...
        </p>

        <p id="mensajeFeedback" class="mensaje"></p>

        <div class="clientes-actions">
          <button type="button" id="btnConfirmarAccion" class="btn btn-danger">Procesar cliente</button>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/js/permissions.js"></script>
<script src="./eliminar_cliente.js"></script>

<script>
  cargarNavegacion("clientes");
  cargarTopbar();
</script>

</body>
</html>
