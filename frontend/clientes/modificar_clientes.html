<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Modificar Cliente</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="../assets/css/topbar.css">
  <link rel="stylesheet" href="./clientes.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="content-wrapper">
    <header class="topbar" id="topbar"></header>

    <main class="main-content">
      <section class="clientes-header">
        <div>
          <h1>Modificar Cliente</h1>
          <p>Actualiza los antecedentes y áreas asociadas del cliente.</p>
        </div>

        <div class="clientes-header-actions">
          <a href="listar_clientes.html" class="btn btn-secondary">Volver al listado</a>
        </div>
      </section>

      <section class="clientes-section">
        <h2>Datos del cliente</h2>

        <form id="formModificarCliente" class="clientes-form">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="rut">RUT</label>
              <input type="text" id="rut" class="form-input" disabled>
            </div>

            <div class="form-group">
              <label class="form-label" for="razon_social">Razón Social</label>
              <input type="text" id="razon_social" class="form-input" required>
            </div>

            <div class="form-group form-full">
              <label class="form-label" for="direccion">Dirección</label>
              <input type="text" id="direccion" class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="telefono">Teléfono</label>
              <input type="tel" id="telefono" class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="email">Correo</label>
              <input type="email" id="email" class="form-input">
            </div>

            <div class="form-group form-full">
              <label class="form-label">Áreas</label>
              <div class="checkbox-group">
                <label class="checkbox-option">
                  <input type="checkbox" name="area_check" value="1" id="checkLegal">
                  Jurídica
                </label>
                <label class="checkbox-option">
                  <input type="checkbox" name="area_check" value="2" id="checkContable">
                  Contable
                </label>
              </div>
            </div>
          </div>

          <button type="button" id="btnPrepararGuardado" class="btn btn-primary">Guardar cambios</button>
          <p id="mensajeFeedback" class="mensaje"></p>
        </form>

        <div id="panelConfirmacion" class="confirm-panel">
          <h2>Confirmar cambios</h2>
          <ol id="listaCambios" class="changes-list"></ol>

          <div class="clientes-actions">
            <button type="button" id="btnConfirmarFinal" class="btn btn-success">Confirmar</button>
            <button type="button" id="btnCancelarConfirmacion" class="btn btn-secondary">Cancelar</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/js/permissions.js"></script>
<script src="./modificar_clientes.js"></script>

<script>
  cargarNavegacion("clientes");
  cargarTopbar();
</script>

</body>
</html>
