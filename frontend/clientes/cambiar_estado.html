<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cambiar Estado de Cliente</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="../assets/css/topbar.css">
  <link rel="stylesheet" href="./clientes.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="content-wrapper">
    <header class="topbar" id="topbar"></header>

    <main class="main-content">
      <section class="clientes-header">
        <div>
          <h1>Cambiar Estado de Cliente</h1>
          <p>Activa o desactiva un cliente y deja registro de auditoría.</p>
        </div>

        <div class="clientes-header-actions">
          <a href="listar_clientes.html" class="btn btn-secondary">Volver al listado</a>
        </div>
      </section>

      <section class="clientes-section">
        <h2>Cliente seleccionado</h2>

        <div class="cliente-detail-grid">
          <div class="cliente-detail-label">Razón Social</div>
          <div class="cliente-detail-value" id="txtRazonSocial">Cargando...</div>
          <div class="cliente-detail-label">RUT</div>
          <div class="cliente-detail-value" id="txtRut">-</div>
          <div class="cliente-detail-label">Estado</div>
          <div class="cliente-detail-value">
            <span class="badge" id="badgeEstado">-</span>
          </div>
        </div>

        <p id="mensajeFeedback" class="mensaje"></p>

        <div class="clientes-actions">
          <button type="button" id="btnCambiarEstado" class="btn btn-primary">Cambiar estado</button>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/js/permissions.js"></script>
<script src="./cambiar_estado.js"></script>

<script>
  cargarNavegacion("clientes");
  cargarTopbar();
</script>

</body>
</html>
