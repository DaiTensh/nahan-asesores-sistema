<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Estado de Cliente | Nahan Asesores</title>

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/cards.css">
    <link rel="stylesheet" href="../assets/css/navigation.css">
    <link rel="stylesheet" href="../assets/css/topbar.css">
    <link rel="stylesheet" href="cambiar_estado.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="content-wrapper">
            <header class="topbar" id="topbar"></header>

            <main class="main-content">
                <div class="mockup-wrapper-estado">
                    <h3 class="mockup-title">Gestión de Estado de Clientes</h3>

                    <div class="usuarios-card panel-estado-card">
                        <div class="cliente-info-header">
                            <h4 id="txtRazonSocial">Cargando cliente...</h4>
                            <p>RUT: <span id="txtRut">-</span></p>
                        </div>

                        <div class="estado-control-box">
                            <span class="label-estado-switch">Estado Operativo:</span>
                            <div class="indicador-estado-actual" id="badgeEstado">-</div>
                        </div>

                        <p class="nota-auditoria-texto">
                            Al cambiar el estado, se registrará automáticamente la trazabilidad de la acción en el historial de auditoría.
                        </p>

                        <div id="mensajeFeedback" class="mensaje"></div>

                        <div class="acciones-estado-flex">
                            <button type="button" id="btnVolver" class="btn-volver-gris">Volver</button>
                            <button type="button" id="btnCambiarEstado" class="btn-cambiar-accion">Alternar Estado</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../auth/logout.js"></script>
    <script src="../assets/js/navigation.js"></script>
    <script src="../assets/js/topbar.js"></script>
    <script src="../assets/js/permissions.js"></script>
    <script src="cambiar_estado.js"></script>

    <script>
        cargarNavegacion("clientes");
        cargarTopbar();
    </script>
</body>
</html>
