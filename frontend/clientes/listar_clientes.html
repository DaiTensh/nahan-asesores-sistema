<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Clientes</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="../assets/css/tables.css">
  <link rel="stylesheet" href="../assets/css/badges.css">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="../assets/css/topbar.css">
  <link rel="stylesheet" href="./clientes.css">
  <style>
    .clientes-table .sort-header {
      align-items: center;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      font: inherit;
      gap: 6px;
      padding: 0;
      text-align: left;
      text-transform: inherit;
    }

    .clientes-table .sort-header:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    .clientes-table .sort-indicator {
      display: inline-block;
      min-width: 1ch;
    }
  </style>
</head>

<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="content-wrapper">
    <header class="topbar" id="topbar"></header>

    <main class="main-content">
      <section class="clientes-header">
        <div>
          <h1>Gestión de Clientes</h1>
          <p>Consulta, filtra y administra los clientes registrados.</p>
        </div>

        <div class="clientes-header-actions">
          <a href="registrar_clientes.html" class="btn btn-primary">Nuevo Cliente</a>
          <a href="filtrar_clientes.html" class="btn btn-secondary">Filtro Avanzado</a>
        </div>
      </section>

      <section class="clientes-section">
        <h2>Filtros</h2>

        <div class="clientes-toolbar">
          <div class="form-group">
            <label class="form-label" for="selectAreaFiltro">Área</label>
            <select id="selectAreaFiltro" class="form-input">
              <option value="TODOS">Todas las áreas</option>
              <option value="1">Jurídica</option>
              <option value="2">Contable</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="inputBuscarTexto">Búsqueda rápida</label>
            <input type="text" id="inputBuscarTexto" class="form-input" placeholder="Nombre o RUT">
          </div>
        </div>
      </section>

      <section class="clientes-section">
        <h2>Clientes registrados</h2>

        <table class="clientes-table">
          <thead>
            <tr>
              <th scope="col">RUT</th>
              <th scope="col" aria-sort="ascending">
                <button type="button" class="sort-header" data-sort="razon_social">
                  Razón Social <span class="sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th scope="col">Área Asociada</th>
              <th scope="col" aria-sort="none">
                <button type="button" class="sort-header" data-sort="estado">
                  Estado <span class="sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th scope="col" aria-sort="none">
                <button type="button" class="sort-header" data-sort="fecha_creacion">
                  Fecha de creación <span class="sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaClientesGeneralCuerpo">
            <tr><td colspan="6" class="text-loading">Cargando clientes...</td></tr>
          </tbody>
        </table>

        <div class="pagination">
          <button type="button" id="btnPaginaAnterior" class="btn btn-secondary btn-small" disabled>Anterior</button>
          <span id="txtIndicadorPagina">Página 1</span>
          <button type="button" id="btnPaginaSiguiente" class="btn btn-secondary btn-small">Siguiente</button>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../assets/js/api_config.js"></script>
<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/js/permissions.js"></script>
<script src="./listar_clientes.js"></script>

<script>
  cargarNavegacion("clientes");
  cargarTopbar();
</script>

</body>
</html>
