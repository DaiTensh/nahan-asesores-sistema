<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Filtrar Clientes</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="../assets/css/topbar.css">
  <link rel="stylesheet" href="./clientes.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="content-wrapper">
    <header class="topbar" id="topbar"></header>

    <main class="main-content">
      <section class="clientes-header">
        <div>
          <h1>Filtrar Clientes</h1>
          <p>Segmenta clientes por área, nombre o RUT.</p>
        </div>

        <div class="clientes-header-actions">
          <a href="listar_clientes.html" class="btn btn-secondary">Volver al listado</a>
        </div>
      </section>

      <section class="clientes-section">
        <h2>Criterios de búsqueda</h2>

        <div class="clientes-toolbar">
          <div class="form-group">
            <label class="form-label" for="selectArea">Área</label>
            <select id="selectArea" class="form-input">
              <option value="TODOS">Todas</option>
              <option value="1">Jurídica</option>
              <option value="2">Contable</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="inputBuscar">Nombre o RUT</label>
            <input type="text" id="inputBuscar" class="form-input" placeholder="Ej: 12.345.678 o empresa">
          </div>
        </div>
      </section>

      <section class="clientes-section">
        <h2>Resultados</h2>

        <table class="clientes-table">
          <thead>
            <tr>
              <th>RUT</th>
              <th>Razón Social</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaClientesCuerpo">
            <tr><td colspan="5" class="text-loading">Consultando registros...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
</div>

<script src="../assets/js/api_config.js"></script>
<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/js/permissions.js"></script>
<script src="./filtrar_clientes.js"></script>

<script>
  cargarNavegacion("clientes");
  cargarTopbar();
</script>

</body>
</html>
