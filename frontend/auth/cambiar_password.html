<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="./login.css">
</head>
<body>

  <main class="login-container">
    <section class="login-card">
      <h1>Nahan Asesores</h1>
      <p class="subtitle" id="subtitulo">Cambiar contraseña</p>

      <p id="avisoObligatorio" class="ayuda" hidden>
        Su contraseña es temporal. Antes de continuar debe establecer una contraseña personal.
      </p>

      <form id="cambiarForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="passwordActual" id="etiquetaActual">Contraseña actual</label>
          <input type="password" id="passwordActual" class="form-input" autocomplete="current-password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordNueva">Contraseña nueva</label>
          <input type="password" id="passwordNueva" class="form-input" minlength="8" autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmacion">Repetir la contraseña nueva</label>
          <input type="password" id="confirmacion" class="form-input" minlength="8" autocomplete="new-password" required>
        </div>

        <p class="ayuda">Mínimo 8 caracteres. No puede ser igual a la actual.</p>

        <button type="submit" class="btn btn-primary" id="botonGuardar">Guardar contraseña</button>
      </form>

      <p id="mensaje" class="mensaje" aria-live="polite"></p>

      <p class="enlace-secundario">
        <a href="#" id="enlaceSalir">Cerrar sesión</a>
        <span id="separadorVolver" hidden> · </span>
        <a href="../dashboard/dashboard.html" id="enlaceVolver" hidden>Volver</a>
      </p>
    </section>
  </main>

  <script src="../assets/js/api_config.js"></script>
  <script src="./cambiar_password.js"></script>
</body>
</html>
