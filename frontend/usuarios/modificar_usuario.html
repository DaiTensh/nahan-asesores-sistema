<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Usuario</title>

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/cards.css">
    <link rel="stylesheet" href="../assets/css/navigation.css">
    <link rel="stylesheet" href="../assets/css/topbar.css">
    <link rel="stylesheet" href="./modificar_usuario.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar" id="sidebar"></aside>

    <div class="content-wrapper">
        <header class="topbar" id="topbar"></header>

        <main class="main-content">
            <section class="modificar-card">
                <div class="modificar-header">
                    <div>
                        <h1>Modificar usuario</h1>
                        <p class="subtitle">Actualiza la información y asignación del usuario interno.</p>
                    </div>

                    <a href="../dashboard/dashboard.html" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

                <div class="buscar-usuario">
                    <div class="form-group">
                        <label class="form-label" for="usuario_busqueda">Usuario</label>
                        <input type="text" id="usuario_busqueda" class="form-input" list="usuarios_datalist" placeholder="Escriba nombre o correo">
                        <input type="hidden" id="id_usuario">
                        <datalist id="usuarios_datalist"></datalist>
                    </div>

                    <button class="btn btn-primary" onclick="buscarUsuario()">
                        Buscar
                    </button>
                </div>

                <form id="formulario" class="form-edit">

                    <div class="form-group">
                        <label class="form-label" for="nombres">Nombre completo</label>
                        <input type="text" id="nombres" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Correo electrónico</label>
                        <input type="email" id="email" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="id_rol">Rol</label>
                        <select id="id_rol" class="form-input">
                            <option value="1">Administrador</option>
                            <option value="2">Usuario del área jurídica</option>
                            <option value="3">Usuario del área contable</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="id_area">Área</label>
                        <select id="id_area" class="form-input">
                            <option value="1">Área jurídica</option>
                            <option value="2">Área contable</option>
                            <option value="3">Ambas áreas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="estado">Estado</label>
                        <select id="estado" class="form-input">
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="INACTIVO">INACTIVO</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btnActualizarUsuario" class="btn btn-primary" onclick="actualizarUsuario()">
                            Guardar cambios
                        </button>

                        <a href="../dashboard/dashboard.html" class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>

                </form>
            </section>
        </main>

    </div>

</div>

<script src="../assets/js/api_config.js"></script>
<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/js/permissions.js"></script>
<script src="../assets/js/usuarios_autocomplete.js"></script>
<script src="./modificar_usuario.js"></script>

<script>
    protegerPagina(["ADMINISTRADOR"]);
    cargarNavegacion("modificar");
    cargarTopbar();

    if (typeof restringirFuncionalidad === "function") {
        restringirFuncionalidad("btnActualizarUsuario", ["ADMINISTRADOR"]);
    }
</script>

</body>
</html>
