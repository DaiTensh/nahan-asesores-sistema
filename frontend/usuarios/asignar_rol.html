<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asignar Rol</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="../assets/css/topbar.css">
  <link rel="stylesheet" href="./asignar_rol.css">
</head>
<body>

<div class="app-layout">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="content-wrapper">
    <header class="topbar" id="topbar"></header>

    <main class="main-content">
      <section class="usuarios-card">
        <h1>Asignar Rol a Usuario</h1>
        <p class="subtitle">Asignación de roles específicos.</p>

        <div class="form-group">
          <label class="form-label" for="usuario_busqueda">Usuario</label>
          <input type="text" id="usuario_busqueda" class="form-input" list="usuarios_datalist" placeholder="Escriba nombre o correo">
          <input type="hidden" id="id_usuario">
          <datalist id="usuarios_datalist"></datalist>
        </div>

        <button class="btn btn-primary" onclick="buscarUsuario()">Buscar Usuario</button>

        <div id="datosUsuario" class="datos hidden">
          <h3>Datos del usuario</h3>
          <p><strong>Nombre:</strong> <span id="nombres"></span></p>
          <p><strong>Correo:</strong> <span id="email"></span></p>
          <p><strong>Rol actual:</strong> <span id="rol_actual"></span></p>
          <p><strong>Área:</strong> <span id="area"></span></p>

          <div class="form-group">
            <label class="form-label" for="id_rol">Nuevo rol</label>
            <select id="id_rol" class="form-input">
              <option value="">Seleccione un rol</option>
              <option value="1">Administrador</option>
              <option value="2">Usuario del área jurídica</option>
              <option value="3">Usuario del área contable</option>
            </select>
          </div>

          <button id="btnAsignarRol" class="btn btn-primary" onclick="asignarRol()">
            Asignar Rol
          </button>
        </div>

        <p id="mensaje" class="mensaje"></p>
      </section>
    </main>
  </div>

</div>

<script src="../assets/js/api_config.js"></script>
<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/js/usuarios_autocomplete.js"></script>
<script src="./asignar_rol.js"></script>
<script src="../assets/js/permissions.js"></script>

<script>
  protegerPagina(["ADMINISTRADOR"]);
  cargarNavegacion("rol");
  cargarTopbar();
</script>

</body>
</html>
