<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Deshabilitar Usuario</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="./desactivar_usuario.css">
</head>
<body>

<div class="app-layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <section class="usuarios-card">
      <h1>Deshabilitar Usuario</h1>
      <p class="subtitle">Eliminar o deshabilitar usuarios del sistema.</p>

      <div class="form-group">
        <label class="form-label">ID Usuario</label>
        <input type="number" id="id_usuario" class="form-input" placeholder="Ej: 1">
      </div>

      <button class="btn btn-primary" onclick="buscarUsuario()">Buscar Usuario</button>

      <div id="datosUsuario" class="datos hidden">
        <h3>Datos del usuario</h3>
        <p><strong>Nombre:</strong> <span id="nombres"></span></p>
        <p><strong>Correo:</strong> <span id="email"></span></p>
        <p><strong>Rol:</strong> <span id="rol"></span></p>
        <p><strong>Área:</strong> <span id="area"></span></p>
        <p><strong>Estado:</strong> <span id="estado"></span></p>

        <button class="btn btn-danger" onclick="desactivarUsuario()">
            Deshabilitar Usuario
        </button>

        <button class="btn btn-danger" onclick="eliminarUsuario()">
            Eliminar Usuario
        </button>

      </div>

      <p id="mensaje" class="mensaje"></p>
    </section>
  </main>

</div>

<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="./desactivar_usuario.js"></script>
<script src="../assets/js/permissions.js"></script>

<script>
  protegerPagina(["ADMINISTRADOR"]);
  cargarNavegacion("desactivar");
</script>

</body>
</html>
