<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productividad por usuario</title>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/buttons.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/cards.css">
  <link rel="stylesheet" href="../assets/css/tables.css">
  <link rel="stylesheet" href="../assets/css/badges.css">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="../assets/css/topbar.css">
  <link rel="stylesheet" href="./reportes.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="content-wrapper">
    <header class="topbar" id="topbar"></header>

    <main class="main-content">
      <section class="reportes-header">
        <div>
          <h1>Productividad por usuario</h1>
          <p>Tareas completadas, tiempo promedio de resolución y carga vigente por usuario, dentro de un período.</p>
        </div>
      </section>

      <section class="reportes-section">
        <h2>Criterios</h2>

        <form id="formProductividad" class="reportes-form">
          <div class="form-group">
            <label class="form-label" for="selectArea">Área</label>
            <select id="selectArea" class="form-input">
              <option value="">Todas las áreas</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="inputFechaInicio">Desde</label>
            <input type="date" id="inputFechaInicio" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="inputFechaFin">Hasta</label>
            <input type="date" id="inputFechaFin" class="form-input" required>
          </div>

          <div class="form-group reportes-form-actions">
            <button type="submit" class="btn btn-primary">Generar reporte</button>
          </div>
        </form>

        <p id="mensajeProductividad" class="mensaje" aria-live="polite"></p>
      </section>

      <section class="reportes-section" id="resultadoProductividad" hidden>
        <h2>Resultado</h2>

        <div class="reportes-meta">
          <div>
            <span class="detail-label">Período consultado</span>
            <strong id="resultadoPeriodo">-</strong>
          </div>
          <div>
            <span class="detail-label">Fecha de generación</span>
            <strong id="resultadoFechaGeneracion">-</strong>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Tareas completadas</th>
                <th>Tiempo promedio de resolución</th>
                <th>Carga vigente</th>
              </tr>
            </thead>
            <tbody id="tablaProductividad"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../assets/js/api_config.js"></script>
<script src="../auth/logout.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/js/permissions.js"></script>
<script src="./productividad.js"></script>

<script>
  protegerPagina(["ADMINISTRADOR"]);
  cargarNavegacion("productividad");
  cargarTopbar();
</script>

</body>
</html>
