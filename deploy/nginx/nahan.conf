server {
    listen 80;
    server_name _;

    root /var/www/nahan-asesores/frontend;
    index auth/login.html;

    # RF54 — Adjuntando Archivos a Tareas. El límite real de tamaño lo pone
    # el parámetro ADJUNTOS_TAMANO_MAXIMO_MB en la base; este solo evita que
    # nginx corte la subida antes de que llegue a Flask (su default es 1M).
    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ /auth/login.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
