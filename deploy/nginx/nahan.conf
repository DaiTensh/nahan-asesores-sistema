# Límite de intentos de inicio de sesión por IP (además del de la aplicación, SEC-02). La zona vive
# fuera del bloque «server»: este archivo se incluye dentro del contexto «http».
limit_req_zone $binary_remote_addr zone=nahan_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /var/www/nahan-asesores-sistema/frontend;
    index auth/login.html;

    # Cabeceras de seguridad básicas (no hay HTTPS todavía: sin HSTS). Nginx no
    # hereda add_header en un location que define los suyos; la ubicación de
    # recursos estáticos las repite.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Los enlaces de notificaciones conservan el prefijo usado en desarrollo.
    rewrite ^/frontend/(.*)$ /$1 last;

    # Límite general. RF54 tiene una excepción en su location de adjuntos.
    client_max_body_size 15m;

    # 10 solicitudes por minuto y por IP, con una ráfaga de 5: de sobra para 7 personas y frena la fuerza bruta.
    location = /api/login {
        limit_req zone=nahan_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Gunicorn admite hasta 300 s por solicitud (nahan.service) para los
        # respaldos (RF60). Sin esta directiva Nginx corta la respuesta a los 60 s
        # y la pantalla informa un error aunque la operación termine.
        proxy_read_timeout 300s;

        location ~ ^/api/tareas/[0-9]+/documentos$ {
            # RF54: MySQL define ADJUNTOS_TAMANO_MAXIMO_MB por archivo (10 MB
            # por defecto) y Flask lo valida. Este techo coincide con
            # MAX_CONTENT_LENGTH_MB de Flask (64 MB por defecto): evita recibir
            # cuerpos sin límite y deja margen para el envoltorio multipart.
            # Ver docs/deploy_aws_demo.md.
            client_max_body_size 64m;
            # En locations regex, proxy_pass no debe incluir una URI.
            # Se conserva /api/... y se heredan los headers del bloque padre.
            proxy_pass http://127.0.0.1:8000;
        }
    }

    # Las redirecciones salen solo con la ruta («Location: /auth/login.html»). Si Nginx
    # las completara con el host perdería el puerto del túnel SSH de la demostración
    # (localhost:8080 → servidor:80) y el navegador caería en localhost:80.
    absolute_redirect off;

    # Las páginas usan rutas relativas (./login.css, ../assets/...). Si el
    # login se entregara bajo otra URL, el navegador resolvería esas rutas
    # contra ella y no encontraría ./login.css ni ./login.js. Por eso la raíz
    # y cualquier página inexistente redirigen a la URL real del login en
    # lugar de servirlo internamente.
    location = / {
        return 302 /auth/login.html;
    }

    location / {
        try_files $uri @login;
    }

    location @login {
        return 302 /auth/login.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2)$ {
        try_files $uri =404;
        # Sin caducidad fija: el navegador revalida (ETag) en cada visita, así una
        # corrección de JS o CSS llega a los usuarios sin esperar días.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
